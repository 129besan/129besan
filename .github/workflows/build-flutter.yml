name: Build AppLockout Flutter
on:
  push:
    branches: [applockout-flutter]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current alpha8 source
        run: |
          cat .github/applockout-alpha8-from6de.patch.gz.b64.part* > "$RUNNER_TEMP/applockout-alpha8-current.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/applockout-alpha8-current.patch.gz.b64")" -eq 33916
          printf '%s  %s\n' '61746cb2b935535dd87d6c84e0d397bc85b253251afe1d89c611ed72a3617a10' "$RUNNER_TEMP/applockout-alpha8-current.patch.gz.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/applockout-alpha8-current.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/applockout-alpha8-current.patch"
          git apply --check "$RUNNER_TEMP/applockout-alpha8-current.patch"
          git apply "$RUNNER_TEMP/applockout-alpha8-current.patch"
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore existing alpha test signing
        run: |
          base64 -d .github/browser-brake-test.keystore.b64 > browser-brake-test.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          text = Path('app/build.gradle').read_text()
          def grab(name):
              match = re.search(rf"{name}\s+'([^']+)'", text)
              if not match:
                  raise SystemExit(f'missing {name} in legacy signing config')
              return match.group(1)
          values = {
              'APPLOCKOUT_TEST_KEY_PATH': str(Path('browser-brake-test.keystore').resolve()),
              'APPLOCKOUT_TEST_STORE_PASSWORD': grab('storePassword'),
              'APPLOCKOUT_TEST_KEY_ALIAS': grab('keyAlias'),
              'APPLOCKOUT_TEST_KEY_PASSWORD': grab('keyPassword'),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in values.items():
                  f.write(f'{key}={value}\n')
          PY
      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Flutter test
        working-directory: flutter_app
        run: flutter test
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-flutter-alpha8-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Package source
        run: |
          rm -rf flutter_app/build flutter_app/.dart_tool
          zip -r applockout-flutter-alpha8-source.zip flutter_app -x 'flutter_app/android/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-flutter-alpha8-source
          path: applockout-flutter-alpha8-source.zip
          if-no-files-found: error
