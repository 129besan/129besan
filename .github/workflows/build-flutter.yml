name: Build AppLockout Flutter
on:
  push:
    branches: [applockout-flutter]
  workflow_dispatch:

concurrency:
  group: applockout-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Flutter test
        working-directory: flutter_app
        run: flutter test
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-flutter-preview-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Package source
        run: |
          rm -rf flutter_app/build flutter_app/.dart_tool
          zip -r applockout-flutter-source.zip flutter_app -x 'flutter_app/android/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-flutter-source
          path: applockout-flutter-source.zip
          if-no-files-found: error
