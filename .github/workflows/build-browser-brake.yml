name: Build AppLockout APK
on:
  push:
    branches:
      - applockout-v0.4.3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore stable test signing key when available
        run: |
          if [ -f .github/browser-brake-test.keystore.b64 ]; then
            base64 -d .github/browser-brake-test.keystore.b64 > browser-brake-test.keystore
          fi
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-v0.4.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source snapshot
        run: |
          rm -rf applockout-source
          mkdir -p applockout-source/.github/workflows
          cp -R app docs applockout-source/
          cp build.gradle settings.gradle README.md .gitignore applockout-source/
          cp .github/workflows/build-browser-brake.yml applockout-source/.github/workflows/
          rm -rf applockout-source/app/build
          (cd applockout-source && zip -r ../applockout-v0.4.3-alpha1-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: applockout-v0.4.3-source
          path: applockout-v0.4.3-alpha1-source.zip
          if-no-files-found: error
