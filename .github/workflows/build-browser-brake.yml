name: Build Browser Brake APK
on:
  push:
    branches:
      - browser-brake-v0.4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore stable test signing key when available
        run: |
          if [ -f .github/browser-brake-test.keystore.b64 ]; then
            base64 -d .github/browser-brake-test.keystore.b64 > browser-brake-test.keystore
          fi
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: browser-brake-v0.4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source snapshot
        run: |
          rm -rf browser-brake-source
          mkdir -p browser-brake-source/.github/workflows
          cp -R app docs browser-brake-source/
          cp build.gradle settings.gradle README.md .gitignore browser-brake-source/
          cp .github/workflows/build-browser-brake.yml browser-brake-source/.github/workflows/
          rm -rf browser-brake-source/app/build
          (cd browser-brake-source && zip -r ../browser-brake-v0.4.0-alpha1-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: browser-brake-v0.4-source
          path: browser-brake-v0.4.0-alpha1-source.zip
          if-no-files-found: error
