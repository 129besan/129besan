name: Build Browser Brake APK
on:
  push:
    branches:
      - browser-brake-v0.3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore public test signing key
        run: base64 -d .github/browser-brake-test.keystore.b64 > browser-brake-test.keystore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: browser-brake-v0.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
