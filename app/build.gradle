plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.besan.browserbrake'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.besan.browserbrake'
        minSdk 29
        targetSdk 36
        versionCode 7
        versionName '0.4.0-alpha1'
    }

    def testKey = rootProject.file('browser-brake-test.keystore')
    if (testKey.exists()) {
        signingConfigs {
            stableTest {
                storeFile testKey
                storePassword 'browserbrake-test'
                keyAlias 'browserbrake'
                keyPassword 'browserbrake-test'
            }
        }
    }

    buildTypes {
        debug {
            if (testKey.exists()) {
                signingConfig signingConfigs.stableTest
            }
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
