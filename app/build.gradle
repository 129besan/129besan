plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.besan.browserbrake'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.besan.browserbrake'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('browser-brake-test.keystore')
            storePassword 'browserbrake-test'
            keyAlias 'browserbrake'
            keyPassword 'browserbrake-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
