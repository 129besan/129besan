plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.besan.browserbrake'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.besan.browserbrake'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '0.3.0-alpha2'
    }

    def testKey = rootProject.file('browser-brake-test.keystore')
    if (testKey.exists()) {
        signingConfigs {
            stableTest {
                storeFile testKey
                storePassword 'browserbrake-test'
                keyAlias 'browserbrake'
                keyPassword 'browserbrake-test'
            }
        }
    }

    buildTypes {
        debug {
            if (testKey.exists()) {
                signingConfig signingConfigs.stableTest
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
